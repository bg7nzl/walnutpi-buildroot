# 推到 main / hardened 时编镜像 zip。第一次会很久，也费磁盘。
name: image

on:
  push:
    branches: [main, hardened]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BR2_JLEVEL: "4"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - uses: actions/cache@v4
        with:
          path: |
            workspace/ref/buildroot
            workspace/ref/uwe5622
          key: refs-${{ runner.os }}-${{ hashFiles('make-zip.sh') }}
          restore-keys: |
            refs-${{ runner.os }}-

      - name: Build zip
        run: ./make-zip.sh

      - uses: actions/upload-artifact@v4
        with:
          name: walnutpi-1b.img.zip
          path: workspace/output/walnutpi-1b.img.zip
          if-no-files-found: error
          retention-days: 14
