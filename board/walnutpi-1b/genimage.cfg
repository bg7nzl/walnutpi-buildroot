image boot.vfat {
	vfat {
		files = {
			"Image",
			"boot.scr"
		}
		file allwinner {
			image = "allwinner"
		}
		file overlays {
			image = "overlays"
		}
	}
	size = 64M
}

image data.ext4 {
	name = "data"
	ext4 {
		label = "walnutpi-data"
		use-mke2fs = true
		extraargs = "-m 1 -d @DATA_EMPTY@"
	}
	size = 16M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0xb0071b1b
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1000K
	}

	partition boot {
		partition-type = 0x0C
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
